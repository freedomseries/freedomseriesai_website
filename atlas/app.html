<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive World Map with Remarks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light Background */
            color: #1e293b; /* Dark text */
            margin: 0;
            overflow: hidden;
        }
        .map-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .country {
            stroke: #ffffff; /* White borders for contrast */
            stroke-width: 0.5px;
            transition: fill 0.2s ease;
            cursor: pointer;
        }
        /* Style for the flight path arcs */
        .remark-arc {
            stroke-width: 1px; /* Thinner stroke */
            fill: none;
            pointer-events: none; /* Arcs should not be interactive */
            opacity: 0.8;
        }
        
        #global-summary-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            max-width: 350px;
            background-color: rgba(15, 23, 42, 0.8);
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 20;
            font-size: 0.875rem;
        }
        #global-summary-panel h3 {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }


        #info-panel {
            position: absolute;
            width: 300px;
            padding: 1rem;
            background: #0f172a; /* Dark Blue Background */
            color: #e2e8f0; /* Light text for dark panel */
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95) translateY(10px);
            transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
            z-index: 10;
        }
        #info-panel.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateY(0);
        }


        #toggle-remarks {
            background: none;
            border: none;
            color: #818cf8; /* Lighter purple for dark theme */
            font-weight: 500;
            cursor: pointer;
            padding: 0.25rem 0;
            margin-top: 0.5rem;
        }
        #remarks-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, margin-top 0.3s ease-in-out;
        }
        #remarks-section.visible {
            max-height: 250px;
            margin-top: 0.75rem;
        }
        #remark-list {
           max-height: 150px;
           overflow-y: auto;
           margin-bottom: 0.5rem;
        }
        #remark-list .remark {
            background-color: #1e293b; /* Darker blue for remarks */
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
        }
        .remark-flag {
            width: 20px;
            height: auto;
            margin-right: 8px;
            border-radius: 2px;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }


        /* Embark Button */
        @keyframes pulse {
            50% { opacity: .7; }
        }
        #embark-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.75rem 1.5rem;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
            z-index: 20;
        }
        #embark-button.loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            cursor: wait;
        }
        #embark-button:hover:not(:disabled) {
            background-color: #4338ca;
            transform: translateX(-50%) translateY(-2px);
        }
        #embark-button:disabled {
            background-color: #a5b4fc;
            cursor: not-allowed;
            opacity: 0.7;
        }


        /* Lightbox for Remarks */
        #lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 15%, rgba(79, 70, 229, 0.35), transparent 45%),
                radial-gradient(circle at 80% 85%, rgba(253, 208, 140, 0.35), transparent 40%),
                rgba(7, 10, 24, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            backdrop-filter: blur(6px);
        }
        #lightbox-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #lightbox-panel {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.96));
            color: #e2e8f0;
            padding: 2.25rem;
            border-radius: 1.25rem;
            text-align: left;
            position: relative;
            transform: translateY(10px) scale(0.97);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 30px 70px rgba(6, 10, 24, 0.55);
            border: 1px solid var(--panel-accent, rgba(148, 163, 184, 0.2));
        }
        #lightbox-overlay.visible #lightbox-panel {
            transform: translateY(0) scale(1);
        }
        #lightbox-flag {
            width: 240px;
            height: 160px;
            object-fit: contain; /* Changed from 'cover' to 'contain' */
            border-radius: 0.5rem;
            margin: 0 auto 0.9rem auto;
        }
        .lightbox-insight {
            margin-bottom: 0.5rem;
            padding: 0.55rem 0.7rem;
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 0.65rem;
        }
        .lightbox-insights {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        @media (max-width: 520px) {
            .lightbox-insights {
                grid-template-columns: 1fr;
            }
        }
        .lightbox-insight h3 {
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #94a3b8;
            margin: 0 0 0.2rem 0;
        }
        .lightbox-insight p {
            margin: 0;
            font-size: 0.82rem;
            color: #e2e8f0;
            line-height: 1.5;
        }
        #lightbox-question {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #e2e8f0;
            line-height: 1.5;
            font-weight: 600;
        }
         #remark-input-lightbox {
            width: 100%;
            padding: 0.65rem 0.75rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 0.375rem;
            margin-bottom: 0.5rem;
            resize: vertical;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        #remark-input-lightbox:focus {
            outline: none;
            border-color: var(--panel-accent, #818cf8);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.18);
        }
        #submit-remark {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(90deg, var(--panel-accent, #4f46e5), var(--panel-accent-2, #6d28d9));
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
        }
        #submit-remark:hover:not(:disabled) {
            background: linear-gradient(90deg, var(--panel-accent-2, #4338ca), var(--panel-accent, #5b21b6));
        }
        #submit-remark:disabled {
            background-color: #a5b4fc;
            cursor: not-allowed;
        }
        #lightbox-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: #e2e8f0;
            font-size: 0.95rem;
            padding: 2rem 2.25rem;
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.92), rgba(30, 41, 59, 0.92));
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 25px 60px rgba(2, 6, 23, 0.55);
        }
        #lightbox-loading-text {
            color: #cbd5e1;
        }
    </style>
</head>
<body>


    <div id="global-summary-panel">

    </div>

    </div>
    
    <button id="embark-button"></button>


    <!-- Remark Lightbox -->

        </div>
        <div id="lightbox-panel" style="display: none;">

    <!-- Info Panel for Country Data -->
    <div id="info-panel">
        <div id="country-info"></div>
        <div id="country-summary" class="mt-3 text-sm text-slate-300"></div>
        <button id="toggle-remarks" style="display: none;">Insights</button>
        <div id="remarks-section">
            <h3 id="remarks-title" class="text-md font-semibold mb-2 text-slate-300"></h3>
            <div id="remark-list"></div>

    </div>


    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, where, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


        // --- CONFIGURATION OBJECT ---
        const CONFIG = {
            // Text for the main remark lightbox
            lightboxTitle: "What comes to mind when you see this flag?",
            lightboxLoadingQuestionText: "Curating a question...",
            lightboxPlaceholder: "Share your thoughts...",
            lightboxFallbackColors: "Color details are still coming into focus.",
            lightboxFallbackVisuals: "Visual motifs are still coming into focus.",
            lightboxFallbackQuestion: "What feeling do these colors and symbols evoke for you?",
            
            // Text for various UI elements and statuses
            embarkButtonText: "Discover a random flag!",
            submitButtonText: "Submit Insight",
            globalSummaryTitle: "Global Conversation Summary",
            remarksTitle: "Insights",
            toggleRemarksShow: "Insights",
            toggleRemarksHide: "Hide insights",
            noRemarksText: "No insights yet.",
            beTheFirstText: "No insights yet. Be the first to add one!",
            loadingSummaryText: "Loading summary...",
            gettingLocationText: "Getting your location...",
            moderatingText: "Moderating insight...",
            approvedText: "Insight approved and added!",
            rejectedText: "Insight rejected by moderator.",
            unavailableText: "Sharing insights is currently unavailable.",
        };
        
        // --- Color Constants ---
        const defaultCountryColor = "#d1d5db"; // Tailwind Gray-300
        const insightColor = "#fdd08c"; // The "Africa" orange from previous config


        // --- Firebase Setup ---
        let db, auth;
        let firebaseReady = false;
        let allRemarksUnsubscribe = null;
        let activeListenersUnsubscribe = null;
        let hoverListenersUnsubscribe = null;


        async function initFirebase() {
            try {
                // Your web app's Firebase configuration
                const firebaseConfig = {
                    apiKey: "AIzaSyBJhjkUbewKXzsnf3eUpOfyLkQmryJUyvs",
                    authDomain: "flags-of-freedom.firebaseapp.com",
                    projectId: "flags-of-freedom",
                    storageBucket: "flags-of-freedom.appspot.com",
                    messagingSenderId: "485333077573",
                    appId: "1:485333077573:web:19ef1483738804a898dd2c",
                    measurementId: "G-12B6CYL7EH"
                };


                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                await signInAnonymously(auth);
                
                console.log("Firebase initialized and user signed in.");
                firebaseReady = true;
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                firebaseReady = false;
                document.getElementById('embark-button').disabled = true;
                document.getElementById('global-summary-content').innerHTML = `<p class="italic text-red-400">Could not connect to remarks service. Please check Firebase security rules.</p>`;
            }
        }
        
        // --- Geolocation ---
        async function getIpLocation() {
            // Service 1: ipapi.co
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error('ipapi.co failed');
                const data = await response.json();
                return { lat: data.latitude, lon: data.longitude, country: data.country_name, country_code: data.country_code.toLowerCase() };
            } catch (error) {
                console.warn("Service 1 (ipapi.co) failed. Trying fallback 1.");
            }


            // Service 2: ip-api.com
            try {
                const response = await fetch('https://ip-api.com/json');
                if (!response.ok) throw new Error('ip-api.com failed');
                const data = await response.json();
                return { lat: data.lat, lon: data.lon, country: data.country, country_code: data.countryCode.toLowerCase() };
            } catch (error) {
                 console.warn("Service 2 (ip-api.com) failed. Trying fallback 2.");
            }


            // Service 3: freegeoip.app
            try {
                const response = await fetch('https://freegeoip.app/json/');
                if (!response.ok) throw new Error('freegeoip.app failed');
                const data = await response.json();
                return { lat: data.latitude, lon: data.longitude, country: data.country_name, country_code: data.country_code.toLowerCase() };
            } catch (error) {
                 console.warn("Service 3 (freegeoip.app) failed. Trying fallback 4.");
            }
            
            // Service 4: ipinfo.io
            try {
                const response = await fetch('https://ipinfo.io/json');
                if (!response.ok) throw new Error('ipinfo.io failed');
                const data = await response.json();
                const [lat, lon] = data.loc.split(',');
                return { lat: parseFloat(lat), lon: parseFloat(lon), country: data.country, country_code: data.country.toLowerCase() };
            } catch (error) {
                console.error("All IP location services failed:", error);
                return null;
            }
        }




        // --- LLM Moderation & Summarization (via postMessage to parent) ---
        // Off Wix there is no page code to answer these requests (the AI moderation, questions and
        // summaries ran on Wix's servers). If nothing answers within a few seconds, fall back:
        // questions use the built-in defaults, and new insights are not posted (no moderation).
        const PARENT_TIMEOUT_MS = 8000;
        const PARENT_FALLBACK = { moderateRemark: { decision: 'unavailable' } };
        function postToParent(action, payload) {
            return new Promise((resolve) => {
                const requestId = action + '_' + Math.random().toString(36).substr(2, 9);
                let done = false;
                function finish(result) {
                    if (done) return;
                    done = true;
                    window.removeEventListener('message', handler);
                    resolve(result);
                }
                function handler(event) {
                    if (event.data && event.data.action === action + 'Result' && event.data.requestId === requestId) {
                        finish(event.data.result);
                    }
                }
                window.addEventListener('message', handler);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ action, requestId, ...payload }, '*');
                }
                setTimeout(() => finish(PARENT_FALLBACK[action] || null), window.parent !== window ? PARENT_TIMEOUT_MS : 0);
            });
        }


        async function moderateRemark(remarkText) {
            return await postToParent('moderateRemark', {
                remarkText
            });
        }


        async function generateCountrySummary(remarksWithOriginText) {
            return await postToParent('generateCountrySummary', {
                remarksWithOriginText
            });
        }


        async function generateGlobalSummary(remarksWithOriginText) {
            return await postToParent('generateGlobalSummary', {
                remarksWithOriginText
            });
        }


        async function generateFlagQuestion(base64ImageData) {
            return await postToParent('generateFlagQuestion', {
                base64ImageData
            });
        }


        async function getFlagAsBase64(url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (error) {
                console.error("Could not fetch flag image for base64 conversion:", error);
                return null;
            }
        }
        
        // --- Firestore Remark Handling ---
        async function addRemark(countryName, remarkText, location) {
            if (!db || !auth.currentUser) return null;
            const remarksRef = collection(db, `map-comments`);
            const docRef = await addDoc(remarksRef, { text: remarkText, targetCountry: countryName, createdAt: serverTimestamp(), userId: auth.currentUser.uid, location: location });
            
            // Trigger summary updates but don't wait for them to finish
            updateAndSaveCountrySummary(countryName);
            updateAndSaveGlobalSummary();


            return docRef.id;
        }


        async function updateAndSaveCountrySummary(countryName) {
            if (!db) return;
            const remarksQuery = query(collection(db, `map-comments`), where("targetCountry", "==", countryName));
            const querySnapshot = await getDocs(remarksQuery);
            const remarks = querySnapshot.docs.map(doc => doc.data());


            if (remarks.length > 0) {
                const remarksWithOrigin = remarks.map(r => `Remark from ${r.location?.country || 'an unknown location'}: "${r.text}"`).join('\n');
                const summaryText = await generateCountrySummary(remarksWithOrigin);
                const summaryRef = doc(db, `map-remark-summaries`, countryName);
                await setDoc(summaryRef, { summary: summaryText, lastUpdated: serverTimestamp() });
                console.log(`Country summary updated for ${countryName}`);
            }
        }


        async function updateAndSaveGlobalSummary() {
            if (!db) return;
            const remarksQuery = query(collection(db, `map-comments`));
            const querySnapshot = await getDocs(remarksQuery);
            const remarks = querySnapshot.docs.map(doc => doc.data());
            if (remarks.length > 0) {
                const remarksWithOrigin = remarks
                    .map(r => `Remark for ${r.targetCountry} from ${r.location?.country || 'an unknown location'}: "${r.text}"`)
                    .join('\n');
                const summaryText = await generateGlobalSummary(remarksWithOrigin);
                const summaryRef = doc(db, `map-remark-summaries`, 'global-summary');
                await setDoc(summaryRef, { summary: summaryText, lastUpdated: serverTimestamp() });
                console.log(`Global summary updated.`);
            }
        }
        
        function listenForActiveCountryRemarks(countryName, remarkListEl) {
            const q = query(collection(db, `map-comments`), where("targetCountry", "==", countryName));
            
            return onSnapshot(q, (snapshot) => {
                remarkListEl.innerHTML = '';
                const countryRemarks = snapshot.docs.map(doc => doc.data()).sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
                if (countryRemarks.length === 0) {
                    remarkListEl.innerHTML = `<p class="text-sm text-slate-400">${CONFIG.noRemarksText}</p>`;
                    document.getElementById('toggle-remarks').style.display = 'none';
                } else {
                    document.getElementById('toggle-remarks').style.display = 'block';
                    countryRemarks.forEach(remark => {
                        const div = document.createElement('div');
                        div.className = 'remark';
                        let flagHtml = '';
                        if(remark.location && remark.location.country_code){
                            flagHtml = `<img src="https://flagcdn.com/w20/${remark.location.country_code}.png" alt="${remark.location.country}" class="remark-flag">`;
                        }
                        div.innerHTML = `${flagHtml}<span>${remark.text}</span>`;
                        remarkListEl.appendChild(div);
                    });
                }
            });
        }
        
        function listenForCountrySummary(countryName, summaryEl) {
            const summaryRef = doc(db, `map-remark-summaries`, countryName);
            summaryEl.style.display = 'none';
            summaryEl.innerHTML = '';
            
            return onSnapshot(summaryRef, (doc) => {
                if (doc.exists()) {
                    summaryEl.innerHTML = `<p>${doc.data().summary}</p>`;
                    summaryEl.style.display = 'block';
                } else {
                    summaryEl.innerHTML = '';
                    summaryEl.style.display = 'none';
                }
            });
        }


        function listenForGlobalSummary(summaryEl) {
            const summaryRef = doc(db, `map-remark-summaries`, 'global-summary');
            return onSnapshot(summaryRef, (doc) => {
                if (doc.exists()) {
                    summaryEl.innerHTML = `<p>${doc.data().summary}</p>`;
                } else {
                    summaryEl.innerHTML = `<p class="italic text-slate-400">${CONFIG.beTheFirstText}</p>`;
                }
            });
        }


        // FIX: Added countriesGroup as an argument
        function listenForAllRemarks(countries, projection, svg, countriesGroup) {
            if (allRemarksUnsubscribe) allRemarksUnsubscribe();
            const q = query(collection(db, `map-comments`));
            const arcsGroup = d3.select(".arcs-group");
            const countryFeaturesByName = new Map(countries.features.map(f => [f.properties.name, f]));
            let isInitialDataLoad = true;
            
            const defs = svg.append("defs");


            allRemarksUnsubscribe = onSnapshot(q, (snapshot) => {
                // Create a set of all countries that have remarks
                const countriesWithInsights = new Set(snapshot.docs.map(doc => doc.data().targetCountry));


                // Update the color of all countries based on insight status
                // FIX: countriesGroup is now defined
                countriesGroup.selectAll("path.country")
                    .each(function(d) {
                        // Find the active country element in the DOM
                        const activeCountryElement = countriesGroup.select("path.country.active").node();
                        const isActive = activeCountryElement === this;


                        const hasInsight = countriesWithInsights.has(d.properties.name);
                        
                        d.properties.hasInsight = hasInsight; // Store this state in the data
                        
                        let targetColor = hasInsight ? insightColor : d.properties.baseColor;


                        // Don't change color if it's the currently "active" (clicked) country
                        if (!isActive) {
                            d3.select(this).attr("fill", targetColor);
                        }
                    });


                // Process added/removed arcs
                snapshot.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const remark = { id: change.doc.id, ...change.doc.data() };
                        if (isInitialDataLoad) {
                            drawArc(remark, false); // Draw initial arcs without animation
                        }
                    } else if (change.type === 'removed') {
                        d3.select(`#arc-${change.doc.id}`).remove();
                    }
                });
                if (snapshot.docChanges().length > 0) {
                  isInitialDataLoad = false;
                }
            });


            function drawArc(remark, shouldAnimate) {
                const destinationFeature = countryFeaturesByName.get(remark.targetCountry);
                if (remark.location && destinationFeature) {
                    const startCoords = [remark.location.lon, remark.location.lat];
                    const endCoords = d3.geoCentroid(destinationFeature);
                    const startPixel = projection(startCoords);
                    const endPixel = projection(endCoords);
                    if (!startPixel || !endPixel) return;
                    
                    const gradientId = `grad-${remark.id}`;

                const height = imageEl.naturalHeight || imageEl.height;
                if (!width || !height) return;

                const sampleSize = 60;
                canvas.width = sampleSize;
                canvas.height = sampleSize;
                ctx.drawImage(imageEl, 0, 0, sampleSize, sampleSize);

                let rTotal = 0;
                let gTotal = 0;
                let bTotal = 0;
                let count = 0;
                let vibrant = { r: 0, g: 0, b: 0, score: 0 };

                try {
                    const data = ctx.getImageData(0, 0, sampleSize, sampleSize).data;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const alpha = data[i + 3];
                        if (alpha < 200) continue;

                        rTotal += r;
                        gTotal += g;
                        bTotal += b;
                        count += 1;

                        const max = Math.max(r, g, b);
                        const min = Math.min(r, g, b);
                        const saturation = max === 0 ? 0 : (max - min) / max;
                        const score = saturation * max;
                        if (score > vibrant.score) {
                            vibrant = { r, g, b, score };
                        }
                    }
                } catch (error) {
                    return;
                }

                if (!count) return;

            });
            
            const closeLightbox = () => {
                lightboxOverlay.classList.remove('visible');
                setTimeout(() => {
                    document.getElementById('lightbox-loader').style.display = 'block';
                    document.getElementById('lightbox-panel').style.display = 'none';
                }, 300);
            };


            embarkBtn.addEventListener('click', async () => {
                embarkBtn.classList.add('loading');
                embarkBtn.disabled = true;


                requestAnimationFrame(async () => {
                    lightboxOverlay.classList.add('visible');
                    
                    const validCountries = countries.features.filter(f => countryNameToAlpha2[f.properties.name]);
                    randomlySelectedCountry = validCountries[Math.floor(Math.random() * validCountries.length)];
                    const code = countryNameToAlpha2[randomlySelectedCountry.properties.name];
                    const flagUrl = `https://flagcdn.com/h240/${code}.png`;
                    
                    const base64ImageData = await getFlagAsBase64(flagUrl);
                    let flagInsights = null;
                    if (base64ImageData) {
                        flagInsights = await generateFlagQuestion(base64ImageData);
                        if (typeof flagInsights === 'string') {
                            try {
                                flagInsights = JSON.parse(flagInsights);
                            } catch (error) {
                                flagInsights = { question: flagInsights };
                            }
                        }
                    }
                    
                    const colorsText = flagInsights?.colors || CONFIG.lightboxFallbackColors;
                    const visualsText = flagInsights?.visuals || CONFIG.lightboxFallbackVisuals;
                    const questionText = flagInsights?.question || CONFIG.lightboxFallbackQuestion;

                    lightboxFlag.crossOrigin = "anonymous";
                    lightboxFlag.src = flagUrl;
                    lightboxColors.textContent = colorsText;
                    lightboxVisuals.textContent = visualsText;
                    lightboxQuestion.textContent = questionText;
                    lightboxFlag.onload = () => setLightboxThemeFromFlag(lightboxFlag);
                    remarkInput.value = '';
                    remarkStatus.textContent = '';
                    submitBtn.disabled = false;
                    
                    document.getElementById('lightbox-loader').style.display = 'none';
                    document.getElementById('lightbox-panel').style.display = 'block';
                    
                    embarkBtn.classList.remove('loading');
                    embarkBtn.disabled = false;
                });
            });
            lightboxOverlay.addEventListener('click', (e) => {
                if (e.target === lightboxOverlay) closeLightbox();
            });


            submitBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const remarkText = remarkInput.value.trim();
                if (!remarkText || !randomlySelectedCountry) return;
                submitBtn.disabled = true;
                remarkStatus.textContent = CONFIG.gettingLocationText;
                const location = await getIpLocation();
                remarkStatus.textContent = CONFIG.moderatingText;
                const moderationResult = await moderateRemark(remarkText);
                if (moderationResult.decision === 'approve') {
                    remarkStatus.textContent = CONFIG.approvedText;
                    
                    setTimeout(async () => {
                        closeLightbox();
                        const destinationFeature = countries.features.find(f => f.properties.name === randomlySelectedCountry.properties.name);
                        if (location && destinationFeature) {
                            const startCoords = [location.lon, location.lat];
                            const endCoords = d3.geoCentroid(destinationFeature);
                            const geoJsonForBounds = { type: "MultiPoint", coordinates: [startCoords, endCoords] };
                            const bounds = path.bounds(geoJsonForBounds);
                            const dx = bounds[1][0] - bounds[0][0];
                            const dy = bounds[1][1] - bounds[0][1];
                            const x = (bounds[0][0] + bounds[1][0]) / 2;
                            const y = (bounds[0][1] + bounds[1][1]) / 2;
                            const scale = Math.max(1, Math.min(4, 0.8 / Math.max(dx / width, dy / height)));
                            const translate = [width / 2 - scale * x, height / 2 - scale * y];
                            
                            svg.transition().duration(1500).ease(d3.easeCubicInOut)
                                .call(zoom.transform, d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale))
                                .on("end", async () => {
                                    const newRemarkId = await addRemark(randomlySelectedCountry.properties.name, remarkText, location);
                                    const newRemarkData = { id: newRemarkId, location: location, targetCountry: randomlySelectedCountry.properties.name};
                                    if (firebaseReady) {
                                        drawArc(newRemarkData, true);
                                    }
                                });
                        }
                    }, 1000);


                } else {
                    remarkStatus.textContent = moderationResult && moderationResult.decision === 'unavailable'
                        ? CONFIG.unavailableText : CONFIG.rejectedText;
                    setTimeout(() => { 
                        remarkStatus.textContent = '';
                        if(randomlySelectedCountry) submitBtn.disabled = false;
                    }, 3000);
                }
            });
        });
    </script>
</body>
</html>
